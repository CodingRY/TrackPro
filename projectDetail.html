<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดโครงงาน</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f6efe6; color: #3b3b3b; }
    header { background: #e9dfcf; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; }
    .back-btn { background: #9a8c7d; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 16px; }
    .back-btn:hover { background: #7a6e60; }
    main { padding: 32px; max-width: 1000px; margin: 0 auto; }

    /* แถบสถานะแบบ Stepper */
    .stepper-wrapper { display: flex; justify-content: space-between; position: relative; margin: 20px 0 40px 0; max-width: 800px; margin-left: auto; margin-right: auto; }
    .stepper-wrapper::before { content: ""; position: absolute; top: 18px; left: 0; width: 100%; height: 3px; background: #e0e0e0; z-index: 1; }
    .stepper-item { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 2; flex: 1; }
    .step-counter { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 3px solid #e0e0e0; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #aaa; margin-bottom: 8px; transition: 0.3s; }
    .step-name { font-size: 14px; color: #999; font-weight: 600; text-align: center; }
    
    .stepper-item.completed .step-counter { background: #6fa36f; border-color: #6fa36f; color: white; }
    .stepper-item.completed .step-name { color: #6fa36f; }
    .stepper-item.active .step-counter { background: #d9a05b; border-color: #d9a05b; color: white; box-shadow: 0 0 10px rgba(217, 160, 91, 0.4); }
    .stepper-item.active .step-name { color: #d9a05b; }
    .stepper-item.rejected .step-counter { background: #c94b3f; border-color: #c94b3f; color: white; }
    .stepper-item.rejected .step-name { color: #c94b3f; }

    /* Layout 2 คอลัมน์ */
    .detail-layout { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
    .detail-main { flex: 2; min-width: 300px; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .detail-summary { flex: 1; min-width: 300px; background: #fffaf2; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 2px solid #e9dfcf; }
    
    .detail-title { font-size: 24px; color: #5a4a3a; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .detail-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; }
    .detail-value { font-size: 16px; color: #333; margin-top: 5px; line-height: 1.6; white-space: pre-wrap; }
    
    .summary-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
    .summary-title { font-weight: bold; color: #5a4a3a; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

    #loading { text-align: center; padding: 50px; font-size: 18px; color: #5a4a3a; }
    #contentContainer { display: none; }
  </style>
</head>
<body>

<header>
  <h1>📑 รายละเอียดโครงงาน</h1>
  <a href="student.html" class="back-btn">← กลับไปหน้าหลัก</a>
</header>

<main>
  <div id="loading">กำลังโหลดข้อมูลโครงงาน... ⏳</div>

  <div id="contentContainer">
    <div class="stepper-wrapper" id="projectStepper">
      <div class="stepper-item" id="step1">
        <div class="step-counter">1</div>
        <div class="step-name">เสนอโครงงาน</div>
      </div>
      <div class="stepper-item" id="step2">
        <div class="step-counter">2</div>
        <div class="step-name">รออนุมัติ</div>
      </div>
      <div class="stepper-item" id="step3">
        <div class="step-counter">3</div>
        <div class="step-name">ดำเนินการ</div>
      </div>
      <div class="stepper-item" id="step4">
        <div class="step-counter">4</div>
        <div class="step-name">เสร็จสมบูรณ์</div>
      </div>
    </div>

    <div class="detail-layout">
      <div class="detail-main">
        <h2 class="detail-title" id="dt-title">ชื่อโครงงาน</h2>
        
        <div class="detail-label">รายละเอียด / บทคัดย่อ</div>
        <div class="detail-value" id="dt-desc">...</div>
        
        <div class="detail-label">หมวดหมู่</div>
        <div class="detail-value" id="dt-category">...</div>
        
        <div class="detail-label">วันที่เสนอโครงงาน</div>
        <div class="detail-value" id="dt-date">...</div>
      </div>
      
      <div class="detail-summary">
        <div class="summary-box">
          <div class="summary-title">🎓 โครงสร้างทีม</div>
          <div style="font-size: 14px;">
            <strong>หัวหน้ากลุ่ม:</strong> <span id="dt-owner"></span><br><br>
            <strong>สมาชิก:</strong> 
            <div id="dt-members" style="color:#666; margin-top:5px; padding-left:10px; border-left:3px solid #e9dfcf;"></div>
          </div>
        </div>
        
        <div class="summary-box">
          <div class="summary-title">👨‍🏫 ครูที่ปรึกษา</div>
          <div style="font-size: 14px;" id="dt-advisor"></div>
        </div>

        <div class="summary-box" style="background: #eef5ee; border-color: #cde0cd;">
          <div class="summary-title">📊 ความคืบหน้าปัจจุบัน</div>
          <div style="font-size: 24px; font-weight: bold; color: #5a7a5d;" id="dt-progress">0%</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://klszrjhdpvsiktddzpga.supabase.co", 
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtsc3pyamhkcHZzaWt0ZGR6cGdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDMzODMsImV4cCI6MjA4NzA3OTM4M30.zcK4gseuAMxweSWEGWYSuUcPui0EJgOcE66XsKw6wUM"
  );

  init();

  async function init() {
    // 1. ดึง ID โครงงานจาก URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');

    if (!projectId) {
      alert("ไม่พบรหัสโครงงาน");
      window.location.href = "student.html";
      return;
    }

    // 2. ดึงข้อมูลจากฐานข้อมูล
    await loadProjectData(projectId);
  }

  async function loadProjectData(projectId) {
    // ดึงข้อมูลโครงงานหลัก
    const { data: project, error: pErr } = await supabaseClient
      .from("student_projects")
      .select("*")
      .eq("id", projectId)
      .single();

    if (pErr || !project) {
      alert("ไม่สามารถดึงข้อมูลโครงงานนี้ได้");
      window.location.href = "student.html";
      return;
    }

    // ดึงรายชื่อสมาชิก
    const { data: membersInfo } = await supabaseClient
      .from("project_member")
      .select("profiles(first_name, last_name)")
      .eq("project_id", projectId);

    const memberNames = membersInfo ? membersInfo.map(m => m.profiles ? `${m.profiles.first_name} ${m.profiles.last_name}` : "") : [];

    // เติมข้อมูลลงบนหน้าจอ
    document.getElementById('dt-title').textContent = project.title;
    document.getElementById('dt-desc').textContent = project.description || "ไม่มีรายละเอียด";
    document.getElementById('dt-category').textContent = project.category || "-";
    document.getElementById('dt-date').textContent = new Date(project.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
    
    document.getElementById('dt-owner').textContent = project.student_name;
    document.getElementById('dt-advisor').textContent = project.advisor || "ยังไม่ระบุ";
    document.getElementById('dt-progress').textContent = `${project.progress || 0}%`;

    const membersHtml = memberNames.length > 0 ? memberNames.map(name => `• ${name}`).join('<br>') : 'ไม่มีสมาชิกอื่นในกลุ่ม';
    document.getElementById('dt-members').innerHTML = membersHtml;

    // อัปเดตแถบสถานะ
    updateStepper(project.status, project.progress || 0);

    // แสดงเนื้อหา และซ่อนตัว Loading
    document.getElementById('loading').style.display = 'none';
    document.getElementById('contentContainer').style.display = 'block';
  }

  function updateStepper(status, progress) {
    const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3'), document.getElementById('step4')];
    
    steps[0].classList.add('completed');

    if (status === 'rejected') {
      steps[1].classList.add('rejected');
      steps[1].querySelector('.step-name').textContent = "❌ ไม่ผ่านอนุมัติ";
    } else if (status === 'approved') {
      steps[1].classList.add('completed');
      steps[1].querySelector('.step-name').textContent = "✅ อนุมัติแล้ว";
      
      if (progress > 0 && progress < 100) {
        steps[2].classList.add('active');
      } else if (progress === 100) {
        steps[2].classList.add('completed');
        steps[3].classList.add('completed');
      } else {
        steps[2].classList.add('active');
      }
    } else {
      steps[1].classList.add('active');
    }
  }
</script>

</body>
</html>
