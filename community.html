const categoryNames = {
  news: 'ข่าวสารทั่วไป',
  problem: 'ปัญหาในชุมชน',

// --- ฟังก์ชันจัดการ Preview รูปภาพ (เพิ่มใหม่) ---
// 1. เมื่อมีการเลือกไฟล์
imageInput.addEventListener('change', function() {
  const file = this.files[0];
  if (file) {
    // ตรวจสอบขนาดไฟล์ก่อนทำ Preview
    if (file.size > 5 * 1024 * 1024) {
      alert('ขนาดไฟล์ใหญ่เกินไป (จำกัดไม่เกิน 5MB)');
      this.value = ''; // ล้างค่าไฟล์ที่เลือก
      imagePreviewContainer.style.display = 'none';
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      imagePreview.src = e.target.result; // ใส่ Source ของรูปภาพจากไฟล์ที่อ่านได้
      imagePreviewContainer.style.display = 'block'; // แสดง Container
    }
    reader.readAsDataURL(file); // อ่านไฟล์ในรูปแบบ Data URL
  } else {
    imagePreviewContainer.style.display = 'none';
  }
});

// 2. เมื่อกดปุ่มลบรูปภาพ Preview
removeImageBtn.addEventListener('click', function() {

  imagePreviewContainer.style.display = 'none'; // ซ่อน Container

function formatThaiDate(value) {
  return new Date(value).toLocaleDateString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  })
}

async function loadEngagement(posts) {
  const likesByPost = new Map()
  const commentsByPost = new Map()
  const postIds = posts.map(post => String(post.id))

  if (!postIds.length) return { likesByPost, commentsByPost }

  const [likesResult, commentsResult] = await Promise.all([
    sb.from('community_post_likes')
      .select('post_id, user_id')
      .in('post_id', postIds),
    sb.from('community_post_comments')
      .select('id, post_id, user_id, author_name, content, created_at')
      .in('post_id', postIds)
      .order('created_at', { ascending: true })
  ])

  if (likesResult.error) console.error('โหลดข้อมูลถูกใจไม่สำเร็จ:', likesResult.error)
  if (commentsResult.error) console.error('โหลดความคิดเห็นไม่สำเร็จ:', commentsResult.error)

  ;(likesResult.data || []).forEach(like => {
    const postId = String(like.post_id)
    if (!likesByPost.has(postId)) likesByPost.set(postId, [])
    likesByPost.get(postId).push(like)
  })

  ;(commentsResult.data || []).forEach(comment => {
    const postId = String(comment.post_id)
    if (!commentsByPost.has(postId)) commentsByPost.set(postId, [])
    commentsByPost.get(postId).push(comment)
  })

  return { likesByPost, commentsByPost }
}

function createCommentElement(comment) {
  const item = document.createElement('div')
  item.className = 'comment-item'

  const author = document.createElement('div')
  author.className = 'comment-author'
  author.textContent = comment.author_name

  const content = document.createElement('p')
  content.className = 'comment-content'
  content.textContent = comment.content

  const date = document.createElement('div')
  date.className = 'comment-date'
  date.textContent = formatThaiDate(comment.created_at)

  item.append(author, content, date)
  return item
}

async function togglePostLike(postId, isLiked, button) {
  if (!currentUser) {
    alert('กรุณาเข้าสู่ระบบด้วยบัญชีสมาชิกก่อนกดถูกใจ')
    return
  }

  button.disabled = true
  const query = sb.from('community_post_likes')
  const { error } = isLiked
    ? await query.delete().eq('post_id', String(postId)).eq('user_id', currentUser.id)
    : await query.insert({ post_id: String(postId), user_id: currentUser.id })

  if (error) {
    console.error('บันทึกการถูกใจไม่สำเร็จ:', error)
    alert(`บันทึกการถูกใจไม่สำเร็จ: ${error.message}`)
    button.disabled = false
    return
  }

  await loadPosts(filterCategory.value)
}

async function submitPostComment(postId, input, button) {
  if (!currentUser) {
    alert('กรุณาเข้าสู่ระบบด้วยบัญชีสมาชิกก่อนแสดงความคิดเห็น')
    return
  }

  const content = input.value.trim()
  if (!content) return

  button.disabled = true
  const { error } = await sb.from('community_post_comments').insert({
    post_id: String(postId),
    user_id: currentUser.id,
    author_name: currentDisplayName,
    content
  })

  if (error) {
    console.error('บันทึกความคิดเห็นไม่สำเร็จ:', error)
    alert(`บันทึกความคิดเห็นไม่สำเร็จ: ${error.message}`)
    button.disabled = false
    return
  }

  input.value = ''
  await loadPosts(filterCategory.value)
}

// โหลดโพสต์ พร้อมข้อมูลถูกใจและความคิดเห็น
async function loadPosts(category = 'all') {
  let query = sb
    .from('community_posts')
    .select('*')
    .order('created_at', { ascending: false })

  if (category !== 'all') query = query.eq('category', category)

  const { data, error } = await query
  if (error) {
    console.error('Error loading posts:', error)
    return
  }

  const posts = data || []
  const { likesByPost, commentsByPost } = await loadEngagement(posts)
  board.innerHTML = ''

  posts.forEach(post => {
    const postId = String(post.id)
    const likes = likesByPost.get(postId) || []
    const comments = commentsByPost.get(postId) || []
    const isLiked = Boolean(currentUser && likes.some(like => like.user_id === currentUser.id))

    const card = document.createElement('article')
    card.className = 'card'

    const tag = document.createElement('span')
    tag.className = 'tag ' + post.category
    tag.textContent = categoryNames[post.category] || 'อื่น ๆ'

    const cardTop = document.createElement('div')
    cardTop.className = 'card-top'
    cardTop.appendChild(tag)

    if (isAdmin) {
      const deleteButton = document.createElement('button')
      deleteButton.type = 'button'
      deleteButton.className = 'admin-delete-btn'
      deleteButton.textContent = '🗑️ ลบโพสต์'
      deleteButton.setAttribute('aria-label', `ลบโพสต์ของ ${post.author || 'ผู้ไม่ระบุชื่อ'}`)
      deleteButton.addEventListener('click', () => deletePost(post, deleteButton))
      cardTop.appendChild(deleteButton)
    }

    const author = document.createElement('div')
    author.className = 'author'
    author.append(document.createTextNode(`โดย: ${post.author || 'ไม่ระบุชื่อ'}`), document.createElement('br'))
    const date = document.createElement('small')
    date.textContent = `📅 ${formatThaiDate(post.created_at)} น.`
    author.appendChild(date)

    const content = document.createElement('p')
    content.textContent = post.content

    card.append(cardTop, author, content)

    if (post.image_url) {
      const img = document.createElement('img')
      img.src = post.image_url
      img.alt = `รูปประกอบโพสต์ของ ${post.author || 'สมาชิกชุมชน'}`
      card.appendChild(img)
    }

    const engagement = document.createElement('div')
    engagement.className = 'post-engagement'

    const likeButton = document.createElement('button')
    likeButton.type = 'button'
    likeButton.className = `engagement-button${isLiked ? ' is-liked' : ''}`
    likeButton.textContent = `${isLiked ? '♥' : '♡'} ถูกใจ ${likes.length}`
    likeButton.addEventListener('click', () => togglePostLike(postId, isLiked, likeButton))

    const commentButton = document.createElement('button')
    commentButton.type = 'button'
    commentButton.className = 'engagement-button'
    commentButton.textContent = `💬 ความคิดเห็น ${comments.length}`

    engagement.append(likeButton, commentButton)
    card.appendChild(engagement)

    const commentsPanel = document.createElement('div')
    commentsPanel.className = 'comments-panel'
    commentsPanel.hidden = true

    const commentsList = document.createElement('div')
    commentsList.className = 'comments-list'
    if (comments.length) {
      comments.forEach(comment => commentsList.appendChild(createCommentElement(comment)))
    } else {
      const empty = document.createElement('p')
      empty.className = 'empty-comments'
      empty.textContent = 'ยังไม่มีความคิดเห็น'
      commentsList.appendChild(empty)
    }
    commentsPanel.appendChild(commentsList)

    if (currentUser) {
      const commentForm = document.createElement('div')
      commentForm.className = 'comment-form'
      const commentInput = document.createElement('input')
      commentInput.type = 'text'
      commentInput.maxLength = 1000
      commentInput.placeholder = `แสดงความคิดเห็นในชื่อ ${currentDisplayName}`
      const submitButton = document.createElement('button')
      submitButton.type = 'button'
      submitButton.textContent = 'ส่ง'
      submitButton.addEventListener('click', () => submitPostComment(postId, commentInput, submitButton))
      commentInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault()
          submitPostComment(postId, commentInput, submitButton)
        }
      })
      commentForm.append(commentInput, submitButton)
      commentsPanel.appendChild(commentForm)
    } else {
      const loginMessage = document.createElement('p')
      loginMessage.className = 'login-to-engage'
      loginMessage.textContent = 'เข้าสู่ระบบด้วยบัญชีสมาชิกเพื่อกดถูกใจหรือแสดงความคิดเห็น'
      commentsPanel.appendChild(loginMessage)
    }

    commentButton.addEventListener('click', () => {
      commentsPanel.hidden = !commentsPanel.hidden
      if (!commentsPanel.hidden && currentUser) commentsPanel.querySelector('input')?.focus()
    })

    card.appendChild(commentsPanel)
    board.appendChild(card)
  })
}

async function initializeBoard() {
  try {
    const { data: { user } } = await sb.auth.getUser()
    currentUser = user

    if (user) {
      const { data: profile, error: profileError } = await sb
        .from('profiles')
        .select('role, first_name, last_name')
        .eq('id', user.id)
        .single()

      if (profileError) throw profileError

      currentProfile = profile
      currentDisplayName = [profile?.first_name, profile?.last_name].filter(Boolean).join(' ').trim()
        || user.email
        || 'สมาชิก TrackPro'
      authorInput.value = currentDisplayName
      authorInput.readOnly = true
      isAdmin = profile?.role === 'admin'
      const homeByRole = {
        admin: 'admin.html',
        teacher: 'dashboard.html',
        student: 'dashboard.html',
        community: 'community.html'
      }
      document.getElementById('homeLink').href = homeByRole[profile?.role] || 'index.html'

      if (isAdmin) {
        document.getElementById('adminModeBadge').hidden = false
      }

      if (profile?.role === 'community') {
        communityLogoutBtn.hidden = false
      }
    }
  } catch (error) {
    console.error('ตรวจสอบสิทธิ์ผู้ใช้งานไม่สำเร็จ:', error)
  }

  await loadPosts()
}

  communityLogoutBtn.disabled = true
  communityLogoutBtn.textContent = 'กำลังออกจากระบบ...'

  const { error } = await sb.auth.signOut()
  if (error) {
    console.error('ออกจากระบบไม่สำเร็จ:', error)
    alert(`ออกจากระบบไม่สำเร็จ: ${error.message}`)
    communityLogoutBtn.disabled = false
    communityLogoutBtn.textContent = originalText
    return
  }

  localStorage.removeItem('role')
  localStorage.removeItem('guest_login')
  window.location.replace('index.html')
})

async function deletePost(post, button) {
  if (!isAdmin) return

  const confirmed = confirm('ต้องการลบโพสต์นี้ออกจากกระดานชุมชนใช่หรือไม่? การลบไม่สามารถย้อนกลับได้')
  if (!confirmed) return

  const originalText = button.textContent
  button.disabled = true
  button.textContent = 'กำลังลบ...'

  const { data, error } = await sb.functions.invoke('admin-users', {
    body: { action: 'delete_community_post', post_id: post.id }
  })

  if (error || !data?.ok) {
    const message = data?.error || error?.message || 'ระบบไม่สามารถลบโพสต์ได้'
    console.error('ลบโพสต์ไม่สำเร็จ:', error || data)
    alert(`ลบโพสต์ไม่สำเร็จ: ${message}`)
    button.disabled = false
    button.textContent = originalText
    return
  }

  await loadPosts(filterCategory.value)
}

// ตรวจสอบบทบาทก่อนโหลดโพสต์ เพื่อให้ปุ่มจัดการแสดงเฉพาะ Admin
initializeBoard()

// ฟังก์ชันเมื่อกดปุ่มโพสต์
postBtn.addEventListener('click', async () => {
  const content = document.getElementById('content').value.trim()
  const category = document.getElementById('category').value
  let author = currentUser ? currentDisplayName : authorInput.value.trim()
  const imageFile = imageInput.files[0] // ใช้ตัวแปร imageInput ที่ประกาศไว้ด้านบน

  if (!content) {
    alert('กรุณาพิมพ์ข้อความก่อนโพสต์')
    return
  }

  if (!author) author = 'ไม่ระบุชื่อ'

  // สถานะกำลังโหลด
  const originalBtnText = postBtn.textContent;
  postBtn.textContent = 'กำลังประมวลผล...';
  postBtn.disabled = true;

  let imageUrl = null

  // ส่วนของการจัดการรูปภาพ
  if (imageFile) {
    // (เอาการตรวจสอบขนาดไฟล์ออกตรงนี้ เพราะตรวจสอบไปแล้วตอนทำ Preview)

    // สร้างชื่อไฟล์แบบสุ่ม
    const fileExt = imageFile.name.split('.').pop()
    const fileName = `${Date.now()}-${Math.floor(Math.random() * 1000)}.${fileExt}`

    console.log("กำลังอัปโหลดไปที่ Bucket:", BUCKET_NAME);

    // 1. อัปโหลดรูปภาพ (เพิ่ม upsert และตรวจสอบ error)
    const { data: uploadData, error: uploadError } = await sb
      .storage
      .from(BUCKET_NAME)
      .upload(fileName, imageFile, {
        cacheControl: '3600',
        upsert: false
      });

    if (uploadError) {
      console.error("Storage Error:", uploadError)
      alert(`อัปโหลดรูปไม่สำเร็จ: ${uploadError.message}\n(ตรวจสอบสิทธิ์ RLS ใน Storage Policy อีกครั้ง)`)
      resetButton(originalBtnText);
      return
    }

    // 2. ดึง Public URL
    const { data: urlData } = sb
      .storage
      .from(BUCKET_NAME)
      .getPublicUrl(fileName)

    imageUrl = urlData.publicUrl
    console.log("อัปโหลดสำเร็จ! URL คือ:", imageUrl);
  }

  // 3. บันทึกข้อมูลลงตาราง community_posts
  const { error: insertError } = await sb
    .from('community_posts')
    .insert([{
      author,
      category,
      content,
      image_url: imageUrl,
      user_id: currentUser?.id || null
    }])

  if (insertError) {
    console.error("Database Error:", insertError)
    alert(`บันทึกโพสต์ไม่สำเร็จ: ${insertError.message}`)
    resetButton(originalBtnText);
    return
  }

  // ล้างค่าฟอร์ม
  document.getElementById('content').value = ''
  if (!currentUser) authorInput.value = ''
  imageInput.value = ''
  imagePreviewContainer.style.display = 'none'; // ซ่อน Preview หลังโพสต์สำเร็จ
  
  alert('โพสต์สำเร็จแล้ว!')
  resetButton(originalBtnText);
  loadPosts(filterCategory.value)
})

function resetButton(text) {
  postBtn.textContent = text;
  postBtn.disabled = false;
}

filterCategory.addEventListener('change', () => {
  loadPosts(filterCategory.value)
})
</script>
