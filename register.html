<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPro | สมัครสมาชิก</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Supabase v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="trackpro-theme.css?v=20260730-12">

  <style>
    .page-register {
      min-height: 100vh;
      color: #493f36;
      background:
        radial-gradient(circle at 12% 18%, rgba(111, 143, 114, .2), transparent 25rem),
        radial-gradient(circle at 88% 82%, rgba(176, 145, 111, .18), transparent 27rem),
        #f6f1e9 !important;
    }

    .page-register header {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 50%;
      width: min(1180px, calc(100% - 40px));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 0 !important;
      transform: translateX(-50%);
    }

    .page-register .brand-logo { width: 48px; height: 48px; flex: 0 0 48px; }
    .page-register header img { width: 48px !important; height: 48px !important; border-radius: 15px !important; object-fit: cover; }
    .page-register header h1 { margin: 0; font-size: 24px !important; letter-spacing: -.02em; }

    .page-register main {
      display: grid;
      min-height: 100vh;
      padding: 112px 20px 46px;
      place-items: center;
    }

    .auth-shell {
      width: min(620px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
      border: 1px solid rgba(222, 211, 197, .95);
      border-radius: 30px;
      background: rgba(255, 253, 249, .9);
      box-shadow: 0 28px 70px rgba(83, 64, 47, .13);
      backdrop-filter: blur(14px);
    }

    .page-register .card {
      width: auto !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 34px clamp(34px, 4vw, 48px) !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: rgba(255, 255, 255, .96) !important;
      box-shadow: none !important;
      text-align: left;
    }

    .page-register .card::before { display: none !important; content: none !important; }
    .card-kicker { margin: 0 0 5px; color: #6f8f72; font-size: 12px; font-weight: 800; letter-spacing: .11em; }
    .page-register .card h2 { margin: 0 !important; font-size: 29px; letter-spacing: -.02em; }
    .card-description { margin: 7px 0 21px; color: #887a6c; font-size: 14px; }

    .register-form { display: grid; gap: 13px; }
    .name-grid, .student-only { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    [hidden] { display: none !important; }

    .auth-field { display: block; }
    .auth-field span, .role-label { display: block; margin-bottom: 7px; color: #5f5348; font-size: 13px; font-weight: 700; }
    .page-register .auth-field input {
      width: 100%;
      min-height: 50px;
      margin: 0 !important;
      padding: 12px 14px !important;
      border-radius: 13px !important;
    }

    .role-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .role-option {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid #e2d6c8;
      border-radius: 13px;
      background: #fffdf9;
      color: #5f5348;
      cursor: pointer;
      font-weight: 700;
    }
    .role-option:has(input:checked) { border-color: #86a58a; background: #edf4ec; box-shadow: 0 0 0 3px rgba(111, 143, 114, .1); }
    .role-option input { width: 18px !important; height: 18px; margin: 0 !important; accent-color: #6f8f72; }

    .page-register #registerBtn {
      width: 100%;
      min-height: 50px;
      margin-top: 3px;
      padding: 12px 16px;
      border: 0;
      border-radius: 13px !important;
      background: #6f8f72;
      color: #fff;
      cursor: pointer;
      font-size: 15px !important;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(83, 119, 87, .18);
      transition: transform .15s ease, background .15s ease;
    }
    .page-register #registerBtn:hover { background: #5f7e63; transform: translateY(-1px); }

    .page-register .login { margin-top: 18px; color: #887a6c; font-size: 13px; text-align: center; }
    .page-register .login a { color: #58705a; text-decoration: none; font-weight: 800; }
    .page-register .login a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      .page-register header { width: calc(100% - 30px); padding-top: 16px !important; }
      .page-register main { padding: 92px 14px 24px; }
      .auth-shell { border-radius: 23px; }
      .page-register .card { padding: 29px 24px !important; }
      .name-grid, .student-only { grid-template-columns: 1fr; }
    }

    @media (max-width: 420px) {
      .role-options { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="page-auth page-register">

<header>
  <a class="brand-logo" href="index.html" aria-label="กลับหน้าเข้าสู่ระบบ">
    <img src="https://img1.pic.in.th/images/ChatGPT-Image-19-..-2569-19_43_40.png" alt="โลโก้ TrackPro">
  </a>
  <h1>TrackPro</h1>
</header>

<main>
  <div class="auth-shell">
    <section class="card" aria-labelledby="registerTitle">
      <p class="card-kicker">สร้างบัญชีใหม่</p>
      <h2 id="registerTitle">สมัครสมาชิก TrackPro</h2>
      <p class="card-description">กรอกข้อมูลให้ครบถ้วนเพื่อเริ่มต้นใช้งาน</p>

      <form id="registerForm" class="register-form">
        <div class="name-grid">
          <label class="auth-field" for="firstName"><span id="firstNameLabel">ชื่อจริง</span><input id="firstName" type="text" placeholder="ชื่อจริง" autocomplete="given-name"></label>
          <label class="auth-field" for="lastName"><span id="lastNameLabel">นามสกุล</span><input id="lastName" type="text" placeholder="นามสกุล" autocomplete="family-name"></label>
        </div>

        <label class="auth-field" for="email"><span>อีเมล</span><input id="email" type="email" placeholder="name@example.com" autocomplete="email"></label>
        <label class="auth-field" for="password"><span>รหัสผ่าน</span><input id="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password"></label>

        <div>
          <span class="role-label">ประเภทบัญชี</span>
          <div class="role-options">
            <label class="role-option"><input type="radio" name="role" value="teacher" checked>ครู</label>
            <label class="role-option"><input type="radio" name="role" value="student">นักเรียน</label>
            <label class="role-option"><input type="radio" name="role" value="community">ชุมชน</label>
          </div>
        </div>

        <div class="student-only" id="studentFields" hidden>
          <label class="auth-field" for="grade"><span>ชั้นเรียน</span><input id="grade" type="text" placeholder="เช่น 4/1"></label>
          <label class="auth-field" for="no"><span>เลขที่</span><input id="no" type="number" min="1" placeholder="เลขที่"></label>
        </div>

        <button id="registerBtn" type="submit">สร้างบัญชี</button>
      </form>

      <div class="login">มีบัญชีแล้ว? <a href="index.html">เข้าสู่ระบบ</a></div>
    </section>
  </div>
</main>

<script>
  /* ===============================
     🔑 Supabase Config
  =============================== */
  const SUPABASE_URL = 'https://klszrjhdpvsiktddzpga.supabase.co'
  const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtsc3pyamhkcHZzaWt0ZGR6cGdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDMzODMsImV4cCI6MjA4NzA3OTM4M30.zcK4gseuAMxweSWEGWYSuUcPui0EJgOcE66XsKw6wUM'

  const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  )

  /* ปรับฟอร์มตามประเภทบัญชี */
  const studentFields = document.getElementById('studentFields')
  const firstNameLabel = document.getElementById('firstNameLabel')
  const lastNameLabel = document.getElementById('lastNameLabel')
  const firstNameInput = document.getElementById('firstName')
  const lastNameInput = document.getElementById('lastName')

  function updateRoleFields() {
    const selectedRole = document.querySelector('input[name="role"]:checked').value
    const isCommunity = selectedRole === 'community'

    studentFields.hidden = selectedRole !== 'student'
    firstNameLabel.textContent = isCommunity ? 'ชื่อผู้ติดต่อ' : 'ชื่อจริง'
    lastNameLabel.textContent = isCommunity ? 'ชื่อชุมชนหรือหน่วยงาน' : 'นามสกุล'
    firstNameInput.placeholder = isCommunity ? 'ชื่อผู้ติดต่อ' : 'ชื่อจริง'
    lastNameInput.placeholder = isCommunity ? 'ชื่อชุมชนหรือหน่วยงาน' : 'นามสกุล'
  }

  document.querySelectorAll('input[name="role"]').forEach(radio => {
    radio.addEventListener('change', updateRoleFields)
  })

  const requestedRole = new URLSearchParams(window.location.search).get('role')
  if (['teacher', 'student', 'community'].includes(requestedRole)) {
    document.querySelector(`input[name="role"][value="${requestedRole}"]`).checked = true
  }
  updateRoleFields()

  document.getElementById('registerForm').addEventListener('submit', event => {
    event.preventDefault()
    register()
  })

  async function register() {
    const firstName = document.getElementById('firstName').value.trim()
    const lastName = document.getElementById('lastName').value.trim()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value.trim()
    const role = document.querySelector('input[name="role"]:checked').value
    const grade = document.getElementById('grade').value
    const no = document.getElementById('no').value

    if (!firstName || !lastName || !email || !password) {
      alert('กรุณากรอกข้อมูลให้ครบ')
      return
    }

    if (role === 'student' && (!grade || !no)) {
      alert('กรุณากรอกชั้นและเลขที่')
      return
    }

    /* สมัคร Auth */
    const { data, error } = await sb.auth.signUp({
      email,
      password
    })

    if (error) {
      alert(error.message)
      return
    }

    /* บันทึก profile */
    const { error: profileError } = await sb
      .from('profiles')
      .insert({
        id: data.user.id,
        role: role,
        first_name: firstName,
        last_name: lastName,
        grade: role === 'student' ? grade : null,
        no: role === 'student' ? Number(no) : null
      })

    if (profileError) {
      alert('สมัครสำเร็จ แต่บันทึกข้อมูลไม่สำเร็จ')
      console.error(profileError)
      return
    }

    alert(role === 'community'
      ? 'สมัครสมาชิกชุมชนสำเร็จ กรุณาเข้าสู่ระบบในฐานะชุมชน'
      : 'สมัครสมาชิกสำเร็จ 🎉')
    window.location.href = role === 'community' ? 'index.html?role=community' : 'index.html'
  }
</script>

</body>
</html>
